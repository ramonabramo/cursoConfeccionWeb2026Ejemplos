<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7 - Localizar posición con indexOf()</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio 7 - Localizar posición con indexOf()</h1>
        <p class="descripcion">Encuentra el índice numérico exacto de un producto en el almacén utilizando el método indexOf().</p>
        <form id="formProducto">
            <label for="inputProducto">Producto a buscar en almacén:</label>
            <input type="text" id="inputProducto" placeholder="Ej: monitor, raton, teclado..." required>
            <button type="submit" id="btnBuscar">Localizar en Almacén</button>
        </form>
        <div id="resultado" class="resultado">Catálogo: [teclado, raton, monitor, auriculares, altavoces]</div>
        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
