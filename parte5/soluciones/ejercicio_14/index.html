<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14 - Bucle for clásico con contador</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio 14 - Bucle for clásico con contador</h1>
        <p class="descripcion">Recorre un array de temperaturas utilizando la estructura tradicional de bucle for con contador numérico e incremento.</p>
        <form id="formFiltro">
            <label for="inputUmbral">Temperatura mínima para filtrar (°C):</label>
            <input type="number" id="inputUmbral" value="20" placeholder="Ej: 20">
            <button type="submit" id="btnFiltrar">Filtrar con Bucle for</button>
        </form>
        <div id="resultado" class="resultado" style="white-space: pre-line;">Temperaturas registradas: [18, 22, 14, 25, 30, 11, 27]</div>
        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
