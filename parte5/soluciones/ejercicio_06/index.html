<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Comprobar existencia con includes()</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio 6 - Comprobar existencia con includes()</h1>
        <p class="descripcion">Verifica si un nombre forma parte de la lista de invitados VIP utilizando el método includes().</p>
        <form id="formInvitado">
            <label for="inputNombre">Nombre del invitado:</label>
            <input type="text" id="inputNombre" placeholder="Escribe un nombre para comprobar..." required>
            <button type="submit" id="btnComprobar">Verificar en Lista</button>
        </form>
        <div id="resultado" class="resultado">Introduce un nombre para verificar si está invitado...</div>
        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
