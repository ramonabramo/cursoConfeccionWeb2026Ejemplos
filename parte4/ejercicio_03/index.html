<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Evitar recarga con e.preventDefault()</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio 3 - Evitar recarga con e.preventDefault()</h1>
        <p class="descripcion">Envía el formulario para comprobar cómo e.preventDefault() evita que la página se reinicie y nos permite validar el campo.</p>
        <form id="formulario">
            <label for="nombre">Nombre de usuario:</label>
            <input type="text" id="nombre" placeholder="Introduce tu nombre">
            <button type="submit" id="btnEnviar">Registrar Usuario</button>
        </form>
        <div id="resultado" class="resultado">Introduce un nombre y pulsa Registrar...</div>
        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
