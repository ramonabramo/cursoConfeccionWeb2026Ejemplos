<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 - Selector desplegable con e.target.value</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio 5 - Selector desplegable con e.target.value</h1>
        <p class="descripcion">Selecciona un país del menú desplegable para consultar su capital y saludo.</p>
        <label for="selectorPais">Elige un país de la lista:</label>
        <select id="selectorPais">
            <option value="">-- Selecciona un país --</option>
            <option value="es">España</option>
            <option value="mx">México</option>
            <option value="ar">Argentina</option>
            <option value="co">Colombia</option>
        </select>
        <div id="resultado" class="resultado">Selecciona una opción del menú desplegable...</div>
        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
