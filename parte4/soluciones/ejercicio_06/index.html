<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Detectar teclas con e.key</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio 6 - Detectar teclas con e.key</h1>
        <p class="descripcion">Escribe en el campo de texto y prueba a pulsar las teclas 'Enter' o 'Escape' para activar acciones especiales.</p>
        <label for="campoBusqueda">Buscador interactivo:</label>
        <input type="text" id="campoBusqueda" placeholder="Escribe y pulsa Enter o Escape...">
        <div id="resultado" class="resultado">Escribe y prueba a pulsar Enter o Escape...</div>
        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
