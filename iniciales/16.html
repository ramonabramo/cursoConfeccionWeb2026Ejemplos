<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*
        decoro la caja de salida
        */
        #salida {
            background-color: #ccc;
            color: black;
            padding: 10px;
            margin: 10px;
            border: 1px solid black;
            border-radius: 4px;
            width: 200px;
            height: 80px;
            line-height: 80px;
        }

        input#nombre {
            border: 1px solid black;
            border-radius: 4px;
            padding: 5px;
            margin: 5px;
            width: 200px;
            height: 30px;
            line-height: 30px;
        }

        /*
        decoro el label del formulario
        */

        span {
            display: inline-block;
            margin: 5px;
            padding: 5px;
            line-height: 30px;
            height: 30px;
        }
    </style>
</head>

<body>
    <div>
        <div>
            <span>Nombre</span>
            <input id="nombre" value="Alpe" />
        </div>
        <br>
        <div id="salida">

        </div>
    </div>
</body>
<script src="16.js"></script>

</html>
