<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solución Oficial · Práctica 1 - Ramón Abramo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-practica">
    <div class="ficha">
      <div class="badge-solucion">✔ SOLUCIÓN OFICIAL PROFESOR</div>
      <h2>🛡️ Ficha del Héroe</h2>
      
      <div class="dato">
        <span class="etiqueta">Nombre:</span>
        <strong id="txtNombre">---</strong>
      </div>
      
      <div class="dato">
        <span class="etiqueta">Clase:</span>
        <strong id="txtClase">---</strong>
      </div>
      
      <div class="dato">
        <span class="etiqueta">Nivel:</span>
        <strong id="txtNivel">---</strong>
      </div>
      
      <div class="dato">
        <span class="etiqueta">Puntos de Vida:</span>
        <strong id="txtVida">---</strong>
        <div class="barra-vida-bg">
          <div class="barra-vida-relleno" id="barraVida" style="width: 100%;"></div>
        </div>
      </div>

      <div class="botones">
        <button id="btnDanio">⚔️ Daño (-20)</button>
        <button id="btnCurar">🧪 Curar (+15)</button>
        <button id="btnNivel">⭐ Subir Nivel</button>
      </div>

      <p id="registro">Esperando acciones...</p>
    </div>

    <footer class="pie-nav">
      <a href="../../index.html">⬅️ Volver a las Prácticas del Ejercicio 18</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
