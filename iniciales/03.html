<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        color: white;
        background-color: red;
        width: 500px;
        margin: 10px auto;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div>Ejemplo de clase</div>
  </body>
  <script>
    // declaracion de variables y constantes
    const nodoDiv = document.querySelector("div");

    let color = "";

    // entradas
    color = prompt("Introduce un color en ingles");

    // procesamiento
    // salidas
    nodoDiv.style.backgroundColor = color;
  </script>
</html>
