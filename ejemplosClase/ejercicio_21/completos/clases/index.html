<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio: CRUD con Clases y LocalStorage</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="contenedor">
        <h1>Registro de Usuarios Avanzado</h1>

        <div class="layout-superior">
            <div class="panel-entrada">
                <h2>Nuevo Registro</h2>
                <label for="txtNombre">Nombre:</label>
                <input type="text" id="txtNombre" placeholder="Introduce el nombre">

                <label for="numEdad">Edad:</label>
                <input type="number" id="numEdad" placeholder="Introduce la edad">

                <button id="btnAccionPrincipal">Añadir y Guardar</button>
            </div>

            <!-- Panel oculto por defecto -->
            <div class="panel-ultimo oculto" id="panelUltimo">
                <h2>Última Operación:</h2>
                <p id="parrafoUltimo"></p>
            </div>
        </div>

        <div class="panel-salida">
            <div class="cabecera-lista">
                <h2>Todos los Datos en LocalStorage:</h2>
                <button id="btnBorrarTodos" class="btn-peligro">Eliminar TODOS</button>
            </div>
            <ul id="listaResultados"></ul>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
