<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica 2 · Ficha de Personaje - Ramón Abramo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-practica">
    <div class="ficha">
      <h2>Ficha del Héroe</h2>

      <div class="dato">
        <span class="etiqueta">Nombre:</span>
        <strong id="txtNombre">Valeria</strong>
      </div>

      <div class="dato">
        <span class="etiqueta">Clase:</span>
        <strong id="txtClase">Exploradora</strong>
      </div>

      <div class="dato">
        <span class="etiqueta">Nivel:</span>
        <strong id="txtNivel">1</strong>
      </div>

      <div class="dato">
        <span class="etiqueta">Puntos de Vida:</span>
        <strong id="txtVida">100 / 100</strong>
      </div>

      <div class="botones">
        <button id="btnDanio">Daño (-20)</button>
        <button id="btnCurar">Curar (+15)</button>
        <button id="btnNivel">Subir Nivel</button>
      </div>

      <p id="registro">Esperando acciones...</p>
    </div>

    <footer class="pie-nav">
      <a href="../index.html">⬅️ Volver al menú de prácticas</a>
    </footer>
  </div>

  <!-- El alumno trabaja sobre app.js. Solución disponible en appSolucion.js -->
  <script src="app.js"></script>
</body>
</html>
