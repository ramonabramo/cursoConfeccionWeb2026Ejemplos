    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>

        <div>

            <input type="number" id="id">
        </div>
        <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre">

            <input type="text" id="habilidad">

    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Habilidad</th>
            </tr>
        </thead>
    </table>

<script src="app.js"></script>

</html>
