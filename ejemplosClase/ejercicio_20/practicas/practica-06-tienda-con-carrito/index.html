<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Práctica 06 · Tienda con carrito</title>
    <!-- Hoja de estilos ya realizada -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="app">
        <h1>Tienda con carrito</h1>
        <p class="subtitulo">Práctica 06 · Reto final: herencia, composición, getters y estáticos</p>
        <h2>Catálogo</h2>
        <div id="catalogo" class="lista rejilla"></div>
        <h2>Carrito</h2>
        <div id="carrito" class="lista"></div>
        <div class="totales">
            <p>Subtotal: <strong id="txtSubtotal">0.00</strong> €</p>
            <p>Envío: <strong id="txtEnvio">0.00</strong> €</p>
            <p class="total">Total: <strong id="txtTotal">0.00</strong> €</p>
        </div>
        <button id="btnVaciar" class="secundario">Vaciar carrito</button>
    </main>

    <!-- El código de esta práctica va en script.js (es lo único que debes escribir) -->
    <script src="script.js"></script>
</body>
</html>
