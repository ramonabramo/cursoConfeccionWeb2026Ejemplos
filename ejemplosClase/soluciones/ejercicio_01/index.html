<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 01 - Primer script en la página (Solución)</title>
</head>
<body>
  <div>Ejemplo de clase</div>

  <script>
    /**
     * EJERCICIO 01 - PRIMER SCRIPT EN LA PÁGINA (SOLUCIÓN)
     *
     * Objetivo:
     * Mostrar cómo se ejecuta el código JavaScript básico incrustado en el documento (script interno)
     * y comunicar datos con el usuario mediante alert().
     *
     * PASOS A REALIZAR:
     * - 1 PASO: Declarar una variable con let llamada mensaje y asignarle el texto "hola clase".
     * - 2 PASO: Mostrar el contenido de la variable en una ventana emergente del navegador usando alert(mensaje).
     */

    // 1. variables y constantes
    let mensaje = "hola clase";

    // 2. salidas
    alert(mensaje);
  </script>
</body>
</html>
