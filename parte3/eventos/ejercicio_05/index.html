<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 - Calificación de un examen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio: Calificación de un examen</h1>
        <p class="descripcion">Introduce una nota entre 0 y 10 y obtén su calificación.</p>

<form id="formulario">
        <label for="nota">Nota:</label>
        <input type="number" id="nota" min="0" max="10" step="0.1" required>
        <button type="button" id="btnCalificar">Calcular calificación</button>
    </form>

    <div id="resultado" class="resultado"></div>

        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
