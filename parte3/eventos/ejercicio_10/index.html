<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10 - Descuento según tipo de cliente</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio: Descuento según tipo de cliente</h1>
        <p class="descripcion">Introduce el importe y selecciona el tipo de cliente para calcular el descuento.</p>

<form id="formulario">
        <label for="importe">Importe de la compra:</label>
        <input type="number" id="importe" min="0" step="0.01" required>

        <label for="tipoCliente">Tipo de cliente:</label>
        <select id="tipoCliente">
            <option value="socio">Socio</option>
            <option value="noSocio">No socio</option>
        </select>

        <button type="button" id="btnCalcular">Calcular descuento</button>
    </form>

    <div id="resultado" class="resultado"></div>

        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
