<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Inicio de sesión</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio: Inicio de sesión</h1>
        <p class="descripcion">Introduce el usuario y la contraseña para comprobar el acceso.</p>

<form id="formulario">
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" required>

        <label for="clave">Contraseña:</label>
        <input type="password" id="clave" required>

        <button type="button" id="btnEntrar">Entrar</button>
    </form>

    <div id="resultado" class="resultado"></div>

        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
