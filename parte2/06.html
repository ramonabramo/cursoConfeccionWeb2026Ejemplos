<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Calculando Datos de un cuadrado</h1>
    <div>
        <form>
            <div>
                <label for="lado">Lado:</label>
                <input type="text" name="lado" id="lado">
            </div>
            <div>
                <button type="button">Calcular</button>
            </div>
        </form>
    </div>
    <div>
        <ul>
            <li>Lado: <span class="salida" id="lado"> - </span> </li>
            <li>Area: <span class="salida" id="area"> - </span></li>
            <li>Perimetro: <span class="salida" id="perimetro"> - </span> </li>
        </ul>
    </div>
    <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <rect id="rectangulo" width="0" height="0" fill="blue" />
    </svg>

</body>

</html>
