<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Trayecto</title>
    <style>
        /* Reseteo básico y tipografía */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Centrado completo del formulario en pantalla */
        body {
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* Tarjeta contenedora */
        form {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Etiquetas */
        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: -0.5rem;
        }

        /* Campos de texto */
        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            color: #1f2937;
            background-color: #f9fafb;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        input[type="text"]:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Botón de acción */
        button {
            margin-top: 0.5rem;
            padding: 0.75rem 1.25rem;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <form>
        <label for="origen">Origen</label>
        <input type="text" name="origen" id="origen" placeholder="Ciudad de salida">

        <label for="destino">Destino</label>
        <input type="text" name="destino" id="destino" placeholder="Ciudad de llegada">

        <button type="button" id="boton">Cambiar</button>
    </form>
</body>
<script src="08.js"></script>
</html>
