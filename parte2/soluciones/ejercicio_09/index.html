<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 09: Manipulación múltiple de estilos CSS con Bootstrap (Solución)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container my-5">
        <h1 class="h3 text-primary mb-4">Ejercicio 9: Control de Estilos Dinámicos</h1>
        <div class="row justify-content-center text-center">
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="circulo border border-3 border-dark rounded-circle mx-auto" id="circulo1"></div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="circulo border border-3 border-dark rounded-circle mx-auto" id="circulo2"></div>
            </div>
            <div class="col-md-3 col-sm-6 mb-3">
                <div class="circulo border border-3 border-dark rounded-circle mx-auto" id="circulo3"></div>
            </div>
        </div>
        
        <div class="row mt-4 text-center">
            <div class="col">
                <button type="button" class="btn btn-danger btn-lg me-2" id="botonRojo">Rojo</button>
                <button type="button" class="btn btn-success btn-lg me-2" id="botonVerde">Verde</button>
                <button type="button" class="btn btn-primary btn-lg" id="botonAzul">Azul</button>
            </div>
        </div>
    </div>

  <!-- Script al final del body para garantizar que el DOM ya existe sin requerir defer -->
  <script src="app.js"></script>
</body>
</html>
