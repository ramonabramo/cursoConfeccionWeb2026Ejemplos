<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - Lectura en tiempo real con e.target.value</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio 4 - Lectura en tiempo real con e.target.value</h1>
        <p class="descripcion">Escribe en el campo de texto para ver cómo el objeto event captura los caracteres introducidos en vivo.</p>
        <label for="campoTexto">Introduce un texto:</label>
        <input type="text" id="campoTexto" placeholder="Escribe algo aquí en vivo...">
        <div id="resultado" class="resultado">Esperando a que escribas algo...</div>
        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
