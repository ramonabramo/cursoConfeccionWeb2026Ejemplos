<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Añadir al final con push()</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio 2 - Añadir al final con push()</h1>
        <p class="descripcion">Añade nuevos productos a la lista de la compra utilizando el método push().</p>
        <form id="formCompra">
            <label for="inputArticulo">Nombre del artículo:</label>
            <input type="text" id="inputArticulo" placeholder="Ej: Manzanas, Leche, Pan...">
            <button type="button" id="btnAgregar">Añadir a la Lista</button>
        </form>
        <div id="resultado" class="resultado">Añade tu primer artículo a la lista...</div>
        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
