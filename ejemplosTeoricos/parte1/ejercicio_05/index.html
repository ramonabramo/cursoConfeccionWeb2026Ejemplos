<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 05: Agrupación de datos en un objeto literal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
        <h1>Ficha de Usuario</h1>
        <ul class="lista-usuario">
            <li><strong>Nombre:</strong> <span id="nombre">Ramon</span></li>
            <li><strong>Población:</strong> <span id="poblacion">Santander</span></li>
            <li><strong>Edad:</strong> <span id="edad">54</span></li>
        </ul>
        <p class="ayuda">Los datos leídos se agruparán en un objeto literal y se registrarán en la consola (F12).</p>
    </main>

  <!-- Script al final del body para asegurar acceso al DOM sin requerir defer -->
  <script src="app.js"></script>
</body>
</html>
