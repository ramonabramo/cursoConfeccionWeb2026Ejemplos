<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7 - Precio según edad</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio: Precio de una entrada según la edad</h1>
        <p class="descripcion">Introduce una edad y calcula el precio de la entrada.</p>

<form id="formulario">
        <label for="edad">Edad:</label>
        <input type="number" id="edad" min="0" required>
        <button type="button" id="btnCalcular">Calcular precio</button>
    </form>

    <div id="resultado" class="resultado"></div>

        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
