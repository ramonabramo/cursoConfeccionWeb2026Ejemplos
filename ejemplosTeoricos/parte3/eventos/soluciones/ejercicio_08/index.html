<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8 - Acceso a una atracción</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio: Acceso a una atracción</h1>
        <p class="descripcion">Introduce la altura y la edad para comprobar el acceso a la atracción.</p>

<form id="formulario">
        <label for="altura">Altura en centímetros:</label>
        <input type="number" id="altura" min="0" required>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" min="0" required>

        <button type="button" id="btnComprobar">Comprobar acceso</button>
    </form>

    <div id="resultado" class="resultado"></div>

        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
