<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Temperatura bajo cero</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio: Temperatura bajo cero</h1>
        <p class="descripcion">Introduce una temperatura y comprueba si está por debajo de cero.</p>

<form id="formulario">
        <label for="temperatura">Temperatura:</label>
        <input type="number" id="temperatura" required>
        <button type="button" id="btnComprobar">Comprobar</button>
    </form>

    <div id="resultado" class="resultado"></div>

        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
