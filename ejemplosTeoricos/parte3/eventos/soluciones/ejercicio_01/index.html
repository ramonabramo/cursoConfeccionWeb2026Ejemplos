<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Descuento en una compra</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio: Descuento en una compra</h1>
        <p class="descripcion">Introduce el importe de una compra y aplica el descuento cuando corresponda.</p>

<form id="formulario">
        <label for="importe">Importe de la compra:</label>
        <input type="number" id="importe" min="0" step="0.01" required>
        <button type="button" id="btnCalcular">Calcular</button>
    </form>

    <div id="resultado" class="resultado"></div>

        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
