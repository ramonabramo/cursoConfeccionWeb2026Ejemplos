<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - Número par o impar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="contenedor">
        <h1>Ejercicio: Número par o impar</h1>
        <p class="descripcion">Introduce un número entero y determina si es par o impar.</p>

<form id="formulario">
        <label for="numero">Número entero:</label>
        <input type="number" id="numero" step="1" required>
        <button type="button" id="btnComprobar">Comprobar</button>
    </form>

    <div id="resultado" class="resultado"></div>

        <p class="ayuda">
            Completa el archivo <strong>app.js</strong> siguiendo los pasos indicados en sus comentarios.
        </p>
    </main>
    <script src="app.js"></script>
</body>
</html>
